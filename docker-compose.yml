services:
  app:
    build: .
    container_name: vinlotteri-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
    # Injects PASSWORD (admin password) from .env on the host at deploy time.
    # .env is gitignored and dockerignored, so the secret never enters the image.
    env_file:
      - .env
    volumes:
      # Bind-mount the JSON "database" so edits to the seed files survive rebuilds.
      - ./data:/app/data
    networks:
      - vinlotteri
      - web

networks:
  vinlotteri:
  # The shared reverse-proxy network Caddy sits on (the same one the poker app
  # joins); created outside this project, so it must already exist:
  #   docker network create web
  web:
    external: true
