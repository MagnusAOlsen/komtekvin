# Local development overlay.
# Usage:  docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# Publishes the app on http://localhost:3000/ and bind-mounts data/ so edits to
# the seed JSON are picked up on the next request.
#
# Note: this runs the production build (Express serving the built client). For
# live frontend editing with hot-reload, use `npm run dev` on the host instead.
#
# This overlay inherits the external `web` network from docker-compose.yml (the
# VPS's Caddy network). It is unused locally but must exist, so run once:
#   docker network create web
services:
  app:
    container_name: vinlotteri-app-local
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    restart: "no"
